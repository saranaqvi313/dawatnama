# Weekly encrypted backup of the Supabase database, kept as a GitHub artifact for 90 days.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL     Supabase → Project Settings → Database → Connection string → "Session pooler" URI
#                       (with your database password filled in)
#   BACKUP_PASSPHRASE   any long password; you need it to open the backup. Keep it somewhere safe.
#
# To restore: download the artifact, then
#   gpg --decrypt dawatnama-db.sql.gz.gpg | gunzip > dump.sql   and run dump.sql in a new database.
name: Database backup

on:
  schedule:
    - cron: '30 21 * * 6'   # every Sunday 02:30 Pakistan time
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "Add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets first."; exit 1; fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, compress and encrypt
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth --schema=storage \
            | gzip -9 > dawatnama-db.sql.gz
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o dawatnama-db.sql.gz.gpg dawatnama-db.sql.gz
          rm dawatnama-db.sql.gz
          ls -lh dawatnama-db.sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: dawatnama-db-${{ github.run_id }}
          path: dawatnama-db.sql.gz.gpg
          retention-days: 90
